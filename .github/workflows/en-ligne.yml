# Met l'application en ligne sur GitHub Pages à chaque envoi sur main :
# https://ismailasadighelwadydiallo-lab.github.io/Diallo-Correction/
# (HTTPS fourni par GitHub : le mode hors ligne et l'installation marchent sur iPhone et Android.)
name: En ligne

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/oc-web/dist
      - id: deploiement
        uses: actions/deploy-pages@v4
